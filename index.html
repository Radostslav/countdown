<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workshop & Cvičební Minutka</title>
  
  <!-- Podpora pro iOS Safari jako PWA (Web App) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Vizuální Časovač (Kruh s ubývající výsečí) -->
    <div class="timer-display">
      <svg class="progress-ring" viewBox="0 0 100 100">
        <!-- Pozadí kruhu -->
        <circle class="progress-ring__background" cx="50" cy="50" r="45" />
        <!-- Ubývající barevný kruh -->
        <circle class="progress-ring__circle" id="progressCircle" cx="50" cy="50" r="45" />
      </svg>
      
      <div class="timer-text-container">
        <span id="phaseLabel" class="phase-label">PŘIPRAVENO</span>
        <span id="timeDisplay" class="time-display">02:00</span>
        <span id="roundDisplay" class="round-display">Kolo 1 / 3</span>
      </div>
    </div>

    <!-- Ovládací tlačítka -->
    <div class="controls">
      <button id="startBtn" class="btn btn-primary">Start</button>
      <button id="resetBtn" class="btn btn-secondary">Reset</button>
    </div>

    <!-- Nastavení parametrů -->
    <div class="settings-card">
      <h2>Nastavení</h2>
      
      <div class="setting-item">
        <label for="workTime">Aktivita / Práce (min:sek)</label>
        <div class="time-inputs">
          <input type="number" id="workMin" value="2" min="0" max="99"> m
          <input type="number" id="workSec" value="0" min="0" max="59"> s
        </div>
      </div>

      <div class="setting-item">
        <label for="restTime">Pauza / Mezera (min:sek)</label>
        <div class="time-inputs">
          <input type="number" id="restMin" value="0" min="0" max="99"> m
          <input type="number" id="restSec" value="30" min="0" max="59"> s
        </div>
      </div>

      <div class="setting-item">
        <label for="rounds">Počet opakování (kol)</label>
        <input type="number" id="rounds" value="3" min="1" max="99" class="number-input">
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
